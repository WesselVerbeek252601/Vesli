<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vesli{% endblock %} | Vesli</title>
  <meta name="description" content="{% block description %}Vesli ontwerpt en bouwt websites voor kappers, cafés en lunchrooms in de Drechtsteden.{% endblock %}">
  <meta name="theme-color" content="#050f0f">
  <link rel="preload" href="{{ url_for('static', filename='fonts/Unbounded.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/SchibstedGrotesk.woff2') }}" as="font" type="font/woff2" crossorigin>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body class="page-{{ active }}">
  <a class="skip-link" href="#main">Naar de inhoud</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ url_for('home') }}">Vesli</a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>

      <nav id="site-nav" class="site-nav" aria-label="Hoofdmenu">
        <ul>
          <li><a href="{{ url_for('home') }}" {% if active == 'home' %}aria-current="page"{% endif %}>Home</a></li>
          <li><a href="{{ url_for('services') }}" {% if active == 'diensten' %}aria-current="page"{% endif %}>Diensten</a></li>
          <li><a href="{{ url_for('portfolio') }}" {% if active == 'portfolio' %}aria-current="page"{% endif %}>Portfolio</a></li>
          <li><a href="{{ url_for('about') }}" {% if active == 'over-ons' %}aria-current="page"{% endif %}>Over ons</a></li>
          <li class="nav-cta"><a class="button button--accent" href="{{ url_for('contact') }}" {% if active == 'contact' %}aria-current="page"{% endif %}>Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p class="footer-logo">Vesli</p>
        <p>Websites voor lokale ondernemers in de Drechtsteden.</p>
      </div>
      <div class="footer-links">
        <p><a href="mailto:{{ contact_email }}">{{ contact_email }}</a></p>
        <p><a href="{{ url_for('privacy') }}">Privacyverklaring</a></p>
        <p>&copy; {{ current_year }} Vesli</p>
      </div>
    </div>
  </footer>
</body>
</html>
